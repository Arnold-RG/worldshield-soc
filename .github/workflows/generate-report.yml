name: Generate SOC report

on:
  workflow_dispatch:
    inputs:
      use_llm:
        description: "Try the optional LLM hook if OPENAI_API_KEY is configured"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate report from the current snapshot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ "${{ inputs.use_llm }}" = "true" ]; then
            python3 scripts/analyze.py --llm
          else
            python3 scripts/analyze.py --no-llm
          fi
      - name: Propose generated updates for review
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/soc-generated-updates
          base: main
          draft: true
          delete-branch: false
          add-paths: |
            public/data/reports
          commit-message: "Update generated SOC data for review"
          title: "chore: review generated SOC data updates"
          body: "Automated SOC data update. Review feed contents, privacy scan, and report output before merging. No automatic production deployment is performed by this workflow."
