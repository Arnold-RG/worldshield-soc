name: Refresh public feeds and SOC report

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch public feeds into the cache
        env:
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
        run: python3 scripts/fetch_feeds.py
      - name: Generate the rule-based SOC report
        env:
          # Optional. Empty when the repository secret is not set.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/analyze.py
      - name: Re-check parsers, the report, and the privacy scan
        run: |
          python3 -m pip install pytest
          python3 -m pytest -v
          python3 scripts/privacy_scan.py
      - name: Propose generated updates for review
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/soc-generated-updates
          base: main
          draft: true
          delete-branch: false
          add-paths: |
            public/data/snapshot.json
            public/data/reports
          commit-message: "Update generated SOC data for review"
          title: "chore: review generated SOC data updates"
          body: "Automated SOC data update. Review feed contents, privacy scan, and report output before merging. No automatic production deployment is performed by this workflow."
